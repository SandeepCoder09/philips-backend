name: Daily Mongo Backup

on:
  schedule:
    - cron: "0 2 * * *"   # Runs daily at 2 AM UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Download MongoDB Database Tools
        run: |
          curl -LO https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.tgz
          tar -xzf mongodb-database-tools-ubuntu2204-x86_64-100.9.4.tgz
          sudo mv mongodb-database-tools-*/bin/* /usr/local/bin/

      - name: Run mongodump (Full Cluster Backup)
        run: |
          mongodump \
            --uri="${{ secrets.MONGO_BACKUP_URI }}" \
            --archive=backup.gz \
            --gzip

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongo-backup
          path: backup.gz
